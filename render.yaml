services:
  - type: web
    name: shifa-nlp-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt && python -m scripts.train_baseline && python -m scripts.train_dialect
    startCommand: uvicorn shifa.serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
